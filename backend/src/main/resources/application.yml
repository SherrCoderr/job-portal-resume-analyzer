server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: job-portal-resume-analyzer

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobportal_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# Application Specific Configurations
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  storage:
    upload-dir: ${UPLOAD_DIR:uploads/resumes}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

logging:
  level:
    root: INFO
    com.jobportal.resumeanalyzer: DEBUG
    org.springframework.security: INFO
